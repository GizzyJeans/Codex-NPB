[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-npb"
version = "0.1.0"
description = "NPB-specific score distribution and Asian market evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-npb = "codex_npb.cli:main"
codex-npb-ledger = "codex_npb.ledger:main"
codex-npb-fetch = "codex_npb.pipeline_cli:fetch_main"
codex-npb-slate = "codex_npb.pipeline_cli:slate_main"
codex-npb-backtest = "codex_npb.pipeline_cli:backtest_main"
codex-npb-board = "codex_npb.pipeline_cli:board_main"
codex-npb-settle = "codex_npb.pipeline_cli:settle_main"
codex-npb-record = "codex_npb.pipeline_cli:record_main"
codex-npb-daily = "codex_npb.pipeline_cli:daily_main"

[tool.setuptools.packages.find]
where = ["src"]
