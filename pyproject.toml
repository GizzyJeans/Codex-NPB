[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-npb"
version = "0.1.0"
description = "NPB-specific score distribution and Asian market evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-npb = "codex_npb.cli:main"
codex-npb-ledger = "codex_npb.ledger:main"

[tool.setuptools.packages.find]
where = ["src"]
